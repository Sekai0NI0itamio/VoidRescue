name: Build Void Rescue versions

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - '1.*/**'
      - '26.3-*/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: 1.12.2-forge
            java: '8'
            gradle: '4.9'
            artifact: voidrescue-1.12.2-forge
          - variant: 1.20.1-fabric
            java: '21'
            gradle: '9.5.0'
            artifact: voidrescue-1.20.1-fabric
          - variant: 1.20.1-forge
            java: '17'
            gradle: '8.14.3'
            artifact: voidrescue-1.20.1-forge
          - variant: 1.21.1-fabric
            java: '21'
            gradle: '9.5.0'
            artifact: voidrescue-1.21.1-fabric
          - variant: 1.21.1-neoforge
            java: '21'
            gradle: '8.14.3'
            artifact: voidrescue-1.21.1-neoforge
          - variant: 1.21.11-fabric
            java: '21'
            gradle: '9.5.0'
            artifact: voidrescue-1.21.11-fabric
          - variant: 1.21.11-neoforge
            java: '21'
            gradle: '8.14.3'
            artifact: voidrescue-1.21.11-neoforge
          - variant: 26.3-fabric
            java: '25'
            gradle: '9.7.1'
            artifact: voidrescue-26.3-fabric
          - variant: 26.3-neoforge
            java: '25'
            gradle: '9.2.1'
            artifact: voidrescue-26.3-neoforge

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build
        working-directory: ${{ matrix.variant }}
        run: gradle build --no-daemon --stacktrace

      - name: Verify the mod JAR exists
        working-directory: ${{ matrix.variant }}
        run: |
          ls -la build/libs/
          if ! ls build/libs/voidrescue-*.jar >/dev/null 2>&1; then
            echo "FAIL: mod JAR not found"
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.variant }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
